<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יואלי אקספרס | אינדקס רכישות פרימיום</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="font-serif text-3xl font-black tracking-tight">יואלי<span class="text-yellow-600">אקספרס</span></div>
            <div class="flex gap-3">
                <button id="btn-submit-link" class="text-xs md:text-sm bg-yellow-600 text-white px-5 py-2 font-bold hover:bg-black transition-colors shadow-md">🎁 הצע קישור</button>
                <button id="btn-admin" class="text-xs md:text-sm bg-black text-white px-5 py-2 font-bold hover:bg-gray-800 transition-colors">ניהול</button>
            </div>
        </div>
    </header>

    <!-- Banner for Submissions -->
    <section class="max-w-7xl mx-auto px-6 mt-8">
        <div class="bg-black text-white rounded-2xl p-8 md:p-10 flex flex-col md:flex-row justify-between items-center gap-6 shadow-xl relative overflow-hidden">
            <div class="relative z-10">
                <span class="bg-yellow-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">מבצע לקהילה</span>
                <h2 class="font-serif text-3xl md:text-4xl font-bold mt-3 mb-2">מצאת מוצר מנצח?</h2>
                <p class="text-gray-300 text-sm md:text-base max-w-xl">שלח לנו את הקישור שלך (לשיין, נקסט או אליאקספרס). אם הוא בדוק וטוב - נפרסם אותו ואתה תיכנס להגרלה שווה!</p>
            </div>
            <button id="btn-submit-banner" class="relative z-10 bg-yellow-600 text-black font-bold px-8 py-4 rounded-full text-base hover:bg-white transition-colors whitespace-nowrap shadow-lg">
                שלח קישור עכשיו ↗
            </button>
            <!-- רקע עיצובי לבאנר -->
            <div class="absolute top-0 left-0 w-full h-full opacity-10" style="background-image: repeating-linear-gradient(45deg, #fff 0, #fff 2px, transparent 2px, transparent 10px);"></div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-6 py-12 w-full">
        <div class="text-center mb-12">
            <h1 class="font-serif text-5xl md:text-7xl font-black mb-4">נבחר בקפידה.</h1>
            <p class="text-xl text-gray-500 font-light">הקישורים שעברו את הסינון שלנו. בלי הפתעות בדואר.</p>
        </div>

        <div class="max-w-2xl mx-auto mb-10 relative">
            <input type="text" id="search-input" placeholder="חיפוש לפי מוצר, קטגוריה או חנות..." class="w-full h-16 pl-6 pr-12 border-2 border-gray-200 rounded-full focus:border-black outline-none text-lg bg-white shadow-sm transition-all">
        </div>

        <div id="categories-container" class="flex flex-wrap justify-center gap-3 mb-12">
            <!-- קטגוריות יוזרקו לכאן על ידי ה-JS -->
        </div>

        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- מוצרים יוזרקו לכאן על ידי ה-JS -->
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-8 text-center text-gray-400 text-sm">
        <p>© 2026 יואלי אקספרס. כל הזכויות שמורות.</p>
    </footer>

    <!-- מודלים נסתרים לחלונות הקופצים -->
    <div id="modal-root"></div>

    <script src="app.js"></script>
</body>
</html>
